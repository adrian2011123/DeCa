<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creador DeCA - Crear cuenta Conductor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        .brand-header {
            width: 100%;
            padding-left: 2rem;
            align-self: flex-start;
            font-size: 0.9rem;
            font-weight: bold;
            color: #000000;
            margin-bottom: 2rem;
        }

        .register-card {
            background-color: #ffffff;
            padding: 2.5rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
        }

        .register-card h1 {
            color: #000000;
            font-size: 2.2rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #4a5568;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            color: #4a5568;
            font-size: 0.85rem;
        }

        .form-group label .required-asterisk {
            color: #e53e3e;
            font-weight: bold;
            margin-left: 2px;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 1rem;
            background-color: #f7fafc;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00695c;
        }

        .info-text {
            font-size: 0.75rem;
            color: #718096;
            line-height: 1.3;
            margin-top: 0.4rem;
            margin-bottom: 1rem;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 0.8rem;
            font-size: 0.85rem;
            color: #4a5568;
        }

        .checkbox-group input {
            margin-top: 3px;
        }

        .checkbox-group a {
            color: #00695c;
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 0.75rem;
            background-color: #00695c;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            margin-bottom: 1rem;
        }

        .btn-submit:hover {
            background-color: #004d40;
        }

        .card-footer {
            text-align: center;
            font-size: 0.85rem;
        }

        .card-footer a {
            color: #00695c;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="brand-header">Creador DeCA</div>

    <div class="register-card">
        <h1>Crear cuenta Conductor</h1>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña (mínimo 4 caracteres)</label>
                <input type="password" id="password" name="password" minlength="4" required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="show-pass" onchange="togglePasswordVisibility()">
                <label for="show-pass">Mostrar contraseña</label>
            </div>

            <div class="form-group" style="margin-top: 1.5rem;">
                <label for="codigo_empresa">Código de la empresa o autónomo<span class="required-asterisk">*</span></label>
                <input type="text" id="codigo_empresa" name="codigo_empresa" placeholder="Introduce el código obligatorio" required>
                <div class="info-text">
                    Es obligatorio introducir el código facilitado por la empresa o autónomo para el que trabajas para poder completar el registro de tu cuenta de conductor.
                </div>
            </div>

            <div class="subtitle" style="margin-top: 1.5rem; margin-bottom: 0.5rem;">Documentos legales - versión 2026-10-02 v1</div>

            <div class="checkbox-group">
                <input type="checkbox" id="aviso_legal" name="aviso_legal" required>
                <label for="aviso_legal">He leído y acepto el <a href="#">Aviso legal</a></label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="privacidad" name="privacidad" required>
                <label for="privacidad">He leído y acepto la <a href="#">Política de privacidad</a></label>
            </div>

            <button type="submit" class="btn-submit">Crear cuenta</button>
        </form>

        <div class="card-footer">
            ¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            const checkbox = document.getElementById('show-pass');
            if (checkbox.checked) {
                passInput.type = 'text';
            } else {
                passInput.type = 'password';
            }
        }
    </script>
</body>
</html>
