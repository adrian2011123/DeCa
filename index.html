<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creador DeCA - Registro Empresa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px 0; }
        .brand-header { width: 100%; padding-left: 2rem; align-self: flex-start; font-size: 0.9rem; font-weight: bold; color: #000000; margin-bottom: 2rem; }
        .register-card { background-color: #ffffff; padding: 2.5rem; border: 1px solid #e2e8f0; border-radius: 8px; width: 100%; max-width: 450px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); margin-bottom: 2rem; }
        .register-card h1 { color: #000000; font-size: 2.2rem; margin-bottom: 0.5rem; font-weight: 500; }
        .subtitle { font-size: 0.8rem; color: #4a5568; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; color: #4a5568; font-size: 0.85rem; }
        .form-group input { width: 100%; padding: 0.6rem; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 1rem; background-color: #f7fafc; }
        .form-group input:focus { outline: none; border-color: #00695c; }
        .info-text { font-size: 0.75rem; color: #718096; line-height: 1.3; margin-top: 0.4rem; margin-bottom: 1rem; }
        .checkbox-group { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 0.8rem; font-size: 0.85rem; color: #4a5568; }
        .checkbox-group input { margin-top: 3px; }
        .checkbox-group a { color: #00695c; text-decoration: underline; }
        .btn-submit { width: 100%; padding: 0.75rem; background-color: #00695c; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; margin-top: 1rem; margin-bottom: 1rem; }
        .btn-submit:hover { background-color: #004d40; }
        .card-footer { text-align: center; font-size: 0.85rem; }
        .card-footer a { color: #00695c; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="brand-header">Creador DeCA</div>

    <div class="register-card">
        <h1>Crear cuenta Empresa</h1>
        <div class="subtitle">Área de registro empresarial privada</div>

        <form id="empresaForm">
            <div class="form-group">
                <label for="razon_social">Nombre o razón social</label>
                <input type="text" id="razon_social" required>
            </div>

            <div class="form-group">
                <label for="cif_nif">CIF/NIF de la empresa</label>
                <input type="text" id="cif_nif" required>
            </div>

            <div class="form-group">
                <label for="transportistas">Número de transportistas</label>
                <input type="number" id="transportistas" value="0" min="0" required oninput="calcularPrecio(this.value)">
                <div class="info-text">
                    10 € al mes (menos de 5 transportistas). Renovación mensual automática.
                </div>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña (mínimo 4 caracteres)</label>
                <input type="password" id="password" minlength="4" required>
            </div>

            <div class="subtitle" style="margin-top: 1.5rem;">Documentos legales - versión 2026-10-02 v1</div>

            <div class="checkbox-group">
                <input type="checkbox" id="aviso_legal" required>
                <label for="aviso_legal">He leído y acepto el <a href="#">Aviso legal</a></label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="privacidad" required>
                <label for="privacidad">He leído y acepto la <a href="#">Política de privacidad</a></label>
            </div>

            <button type="submit" id="btn-pagar" class="btn-submit">Pagar 10 €/mes y crear cuenta</button>
        </form>

        <div class="card-footer">
            ¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a>
        </div>
    </div>

    <script>
        function calcularPrecio(num) {
            const btn = document.getElementById('btn-pagar');
            let cantidad = parseInt(num) || 0;
            let precio = cantidad >= 5 ? cantidad * 2 : 10;
            btn.innerText = `Pagar ${precio} €/mes y crear cuenta`;
        }

        document.getElementById('empresaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'panel-empresa.html';
        });
    </script>
</body>
</html>
