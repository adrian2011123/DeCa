<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creador DeCA - Iniciar sesión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            padding: 20px 0;
        }

        .brand-header {
            width: 100%;
            padding-left: 2rem;
            align-self: flex-start;
            font-size: 0.9rem;
            font-weight: bold;
            color: #000000;
        }

        .login-card {
            background-color: #ffffff;
            padding: 2.5rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .login-card h1 {
            color: #000000;
            font-size: 2.2rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            color: #4a5568;
            font-size: 0.85rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 1rem;
            background-color: #f7fafc;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00695c;
        }

        .btn-submit {
            width: 100%;
            padding: 0.75rem;
            background-color: #00695c;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
        }

        .btn-submit:hover {
            background-color: #004d40;
        }

        .login-footer-links {
            text-align: center;
            font-size: 0.85rem;
        }

        .login-footer-links a {
            color: #00695c;
            text-decoration: underline;
        }

        .legal-footer {
            font-size: 0.8rem;
            display: flex;
            gap: 1.5rem;
        }

        .legal-footer a {
            color: #00695c;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="brand-header">Creador DeCA</div>

    <div class="login-card">
        <h1>Iniciar sesión</h1>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn-submit">Entrar</button>
        </form>

        <div class="login-footer-links">
            ¿No tienes cuenta? <a href="registro-conductor.html">Crea una aquí</a>
        </div>
    </div>

    <div class="legal-footer">
        <a href="#">Aviso legal</a>
        <a href="#">Política de privacidad</a>
    </div>

</body>
</html>
